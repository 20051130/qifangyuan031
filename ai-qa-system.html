<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于LLM的AI问答系统流程图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .svg-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }
        svg {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>基于LLM的AI问答系统流程图</h1>
    <div class="svg-container">
        <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
                </marker>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#8BC34A;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#03A9F4;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                </filter>
            </defs>

            <!-- 用户输入 -->
            <rect x="50" y="300" width="120" height="60" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
            <text x="110" y="325" text-anchor="middle" fill="white" font-size="14" font-weight="bold">用户</text>
            <text x="110" y="345" text-anchor="middle" fill="white" font-size="14" font-weight="bold">输入问题</text>

            <!-- 箭头: 用户输入 -> 问题理解 -->
            <line x1="170" y1="330" x2="230" y2="330" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- 问题理解模块 -->
            <rect x="230" y="280" width="140" height="100" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
            <text x="300" y="310" text-anchor="middle" fill="white" font-size="14" font-weight="bold">问题理解</text>
            <text x="300" y="335" text-anchor="middle" fill="white" font-size="12">意图识别</text>
            <text x="300" y="355" text-anchor="middle" fill="white" font-size="12">实体提取</text>
            <text x="300" y="370" text-anchor="middle" fill="white" font-size="12">上下文分析</text>

            <!-- 箭头: 问题理解 -> 知识检索 -->
            <line x1="370" y1="330" x2="430" y2="330" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- 知识检索 -->
            <rect x="430" y="280" width="140" height="100" rx="10" fill="url(#grad3)" filter="url(#shadow)"/>
            <text x="500" y="310" text-anchor="middle" fill="white" font-size="14" font-weight="bold">知识检索</text>
            <text x="500" y="335" text-anchor="middle" fill="white" font-size="12">向量数据库</text>
            <text x="500" y="355" text-anchor="middle" fill="white" font-size="12">知识库匹配</text>
            <text x="500" y="370" text-anchor="middle" fill="white" font-size="12">相关文档</text>

            <!-- 箭头: 知识检索 -> LLM处理 -->
            <line x1="570" y1="330" x2="630" y2="330" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- LLM处理核心 -->
            <ellipse cx="700" cy="330" rx="80" ry="60" fill="url(#grad4)" filter="url(#shadow)"/>
            <text x="700" y="320" text-anchor="middle" fill="white" font-size="16" font-weight="bold">LLM</text>
            <text x="700" y="345" text-anchor="middle" fill="white" font-size="14">大语言模型</text>
            <text x="700" y="365" text-anchor="middle" fill="white" font-size="12">推理生成</text>

            <!-- 箭头: LLM处理 -> 答案生成 -->
            <line x1="780" y1="330" x2="830" y2="330" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- 答案生成 -->
            <rect x="830" y="280" width="130" height="100" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
            <text x="895" y="310" text-anchor="middle" fill="white" font-size="14" font-weight="bold">答案生成</text>
            <text x="895" y="335" text-anchor="middle" fill="white" font-size="12">格式化输出</text>
            <text x="895" y="355" text-anchor="middle" fill="white" font-size="12">质量校验</text>
            <text x="895" y="370" text-anchor="middle" fill="white" font-size="12">置信度评估</text>

            <!-- 上方: 数据存储层 -->
            <rect x="230" y="50" width="730" height="80" rx="10" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
            <text x="595" y="80" text-anchor="middle" fill="#1565C0" font-size="16" font-weight="bold">数据存储层</text>
            <text x="595" y="105" text-anchor="middle" fill="#1565C0" font-size="12">知识库 | 向量数据库 | 历史对话记录 | 用户画像</text>

            <!-- 下方: 反馈与优化 -->
            <rect x="230" y="450" width="730" height="80" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
            <text x="595" y="480" text-anchor="middle" fill="#E65100" font-size="16" font-weight="bold">反馈与优化</text>
            <text x="595" y="505" text-anchor="middle" fill="#E65100" font-size="12">用户反馈收集 | 模型微调 | 知识库更新 | 性能监控</text>

            <!-- 连接线: 数据存储层 -> 问题理解 -->
            <line x1="300" y1="130" x2="300" y2="280" stroke="#2196F3" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
            <text x="310" y="200" fill="#1565C0" font-size="11">读取</text>

            <!-- 连接线: 数据存储层 -> 知识检索 -->
            <line x1="500" y1="130" x2="500" y2="280" stroke="#2196F3" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
            <text x="510" y="200" fill="#1565C0" font-size="11">检索</text>

            <!-- 连接线: LLM处理 -> 数据存储层 -->
            <line x1="700" y1="270" x2="700" y2="130" stroke="#9C27B0" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
            <text x="710" y="200" fill="#9C27B0" font-size="11">更新</text>

            <!-- 连接线: 答案生成 -> 反馈 -->
            <line x1="895" y1="380" x2="895" y2="450" stroke="#FF9800" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

            <!-- 连接线: 反馈 -> LLM -->
            <line x1="700" y1="450" x2="700" y2="390" stroke="#FF9800" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
            <text x="660" y="430" fill="#E65100" font-size="11">优化</text>

            <!-- 标题 -->
            <text x="500" y="600" text-anchor="middle" fill="#333" font-size="20" font-weight="bold">基于大语言模型的智能问答系统架构</text>
            <text x="500" y="630" text-anchor="middle" fill="#666" font-size="14">LLM-based AI Question Answering System Architecture</text>

            <!-- 图例 -->
            <rect x="50" y="650" width="20" height="20" fill="url(#grad1)" rx="3"/>
            <text x="80" y="665" fill="#333" font-size="12">输入/输出</text>

            <rect x="180" y="650" width="20" height="20" fill="url(#grad2)" rx="3"/>
            <text x="210" y="665" fill="#333" font-size="12">处理模块</text>

            <rect x="310" y="650" width="20" height="20" fill="url(#grad3)" rx="3"/>
            <text x="340" y="665" fill="#333" font-size="12">检索模块</text>

            <rect x="440" y="650" width="20" height="20" fill="url(#grad4)" rx="3"/>
            <text x="470" y="665" fill="#333" font-size="12">核心模型</text>

            <rect x="570" y="650" width="20" height="20" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="3"/>
            <text x="600" y="665" fill="#333" font-size="12">存储层</text>

            <rect x="700" y="650" width="20" height="20" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="3"/>
            <text x="730" y="665" fill="#333" font-size="12">优化层</text>
        </svg>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我介绍</title>
        <link rel= "stylesheet" href="./html_basic.css">
</head>
<body>
    <h2 class="title-demo">自我介绍</h2>

    <p class="text-cont">大家好，我叫葛佳磊。平时没事喜欢玩玩电脑，最近在学网页制作。</p>
    <p>我平时比较宅，有空就打打游戏看看视频。<strong>希望能把前端学好。</strong></p>
    <hr>

    <h2 class="title-demo">我的爱好</h2>
    <ul>
        <li>打游戏</li>
        <li>看视频</li>
        <li>写写代码</li>
    </ul>

    <ol type="A">
        <li>学好HTML</li>
        <li>搞懂CSS</li>
        <li>多敲代码练习</li>
    </ol>

    <h2 class="title-demo">个人信息</h2>
    <table id="user-table" border="2" cellspacing="0" cellpadding="3">
        <caption>我的信息</caption>
        <tr>
            <th>名字</th>
            <th>年龄</th>
            <th>城市</th>
        </tr>
        <tr>
            <td>葛佳磊</td>
            <td>20</td>
            <td>大连</td>
        </tr>
    </table>

    <h2 class="title-demo">想说的话</h2>
    <div>
        <p>刚开始学写网页，很多东西还不太熟。</p>
        <p>多写多练应该就能慢慢熟练。</p>
    </div>

    <h2 class="title-demo">跳转链接</h2>
    <a href="http://baidu.com" target="_blank">点我去百度</a>

    <h2 class="title-demo">简单留言</h2>
    <form action="http://baidu.com" method="post">
        <p>昵称：
            <input type="text" placeholder="输入昵称">
        </p>
        <p>留言：
            <textarea cols="30" rows="4"></textarea>
        </p>
        <p>
            <input type="submit" value="提交">
            <input type="reset" value="重置">
        </p>
    </form>

</body>
</html>

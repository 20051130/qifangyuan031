<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息表</title>
    <link rel="stylesheet" href="./html.basic.css">
</head>
<body>
    <h2 class="title-demo">个人信息表页面</h2>
    <a href="./html.base004.html">← 返回主页面</a>
    <br><br>
    <!-- cellspacing是单元格之间的距离，
     cellpadding="3"是单元格内容与边框之间的距离 -->
    <table id="user-table" border="2" cellspacing="0" cellpadding="3">
        <caption>信息表</caption>
        <tr>
            <th>姓名</th>
            <th>年龄</th>
            <th>性别</th>
            <th>城市</th>
            <th>专业</th>
            <th>擅长</th>
        </tr>
        <tr>
            <td>张博文</td>
            <td>18</td>
            <td>男</td>
            <td>天津</td>
            <td>计算机科学与技术</td>
            <td>唱，跳，rap，篮球</td>
        </tr>
    </table>
</body>
</html>

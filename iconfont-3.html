<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>字体图标底部导航 | iconfont-3</title>
  <!-- 画世界 iconfont 字体图标（@font-face + ::before 伪元素） -->
  <link rel="stylesheet" href="画世界/css/hjicon.css">
  <style>
    /* ===== 设计令牌 ===== */
    :root {
      --qfy-primary: #0091fc;          /* 画世界品牌蓝 */
      --qfy-primary-dark: #0077d4;
      --qfy-primary-soft: rgba(0, 145, 252, 0.10);
      --qfy-bg: #0e0f13;
      --qfy-surface: #ffffff;
      --qfy-text: #1a1a2e;
      --qfy-text-muted: #9aa0ac;
      --qfy-badge: #ff4757;
      --qfy-nav-h: 62px;
      --qfy-radius: 16px;
      --qfy-shadow: 0 -6px 30px rgba(0, 0, 0, 0.10);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "SF Pro Text", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at top, #1c2030 0%, var(--qfy-bg) 65%);
      color: var(--qfy-text);
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      /* 为固定底部导航预留空间 */
      padding-bottom: calc(var(--qfy-nav-h) + env(safe-area-inset-bottom) + 20px);
    }

    /* ===== 顶部：画布氛围标题区 ===== */
    .qfy_canvas {
      position: relative;
      padding: 56px 24px 28px;
      text-align: center;
      color: #fff;
    }
    .qfy_canvas h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .qfy_canvas p {
      margin: 0;
      font-size: 13px;
      opacity: 0.55;
    }

    /* ===== 右上角搜索图标按钮（玻璃态） ===== */
    .qfy_search_btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.20);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .qfy_search_btn:hover {
      background: rgba(255, 255, 255, 0.24);
      transform: scale(1.08);
    }
    .qfy_search_btn:active { transform: scale(0.95); }
    .qfy_search_btn .hjicon { font-size: 19px; color: #fff; }

    /* ===== 内容卡片（模拟 app 内容） ===== */
    .qfy_content { padding: 0 16px 24px; }
    .qfy_card {
      background: var(--qfy-surface);
      border-radius: var(--qfy-radius);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }
    .qfy_card h3 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 600;
    }
    .qfy_card p {
      margin: 0;
      font-size: 13px;
      color: var(--qfy-text-muted);
      line-height: 1.7;
    }

    /* ===== 固定底部导航（自适应宽度，移动端模式） ===== */
    .qfy_tabbar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: calc(var(--qfy-nav-h) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--qfy-surface);
      display: flex;
      box-shadow: var(--qfy-shadow);
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      z-index: 100;
    }
    .qfy_tab_item {
      flex: 1;                      /* 4 项等宽自适应 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--qfy-text-muted);
      text-decoration: none;
      position: relative;
      transition: color 0.25s ease;
    }
    .qfy_tab_item .hjicon {
      font-size: 26px;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .qfy_tab_item span.qfy_label { font-size: 11px; font-weight: 500; }
    /* 选中态 */
    .qfy_tab_item.qfy_active { color: var(--qfy-primary); }
    .qfy_tab_item.qfy_active .hjicon { transform: translateY(-2px) scale(1.06); }
    .qfy_tab_item.qfy_active span.qfy_label { font-weight: 600; }
    /* 选中态下方细指示条 */
    .qfy_tab_item.qfy_active::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 16px;
      height: 3px;
      border-radius: 2px;
      background: var(--qfy-primary);
    }

    /* ===== 数字徽章（右上角） ===== */
    .qfy_badge {
      position: absolute;
      top: 4px;
      right: calc(50% - 26px);
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--qfy-badge);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      box-shadow: 0 0 0 2px var(--qfy-surface);
    }

    /* ===== 红点（右上角） ===== */
    .qfy_dot {
      position: absolute;
      top: 6px;
      right: calc(50% - 22px);
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--qfy-badge);
      box-shadow: 0 0 0 2px var(--qfy-surface);
      animation: qfy_pulse 1.8s ease-in-out infinite;
    }
    @keyframes qfy_pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.75; }
    }

    /* ===== 返回首页链接 ===== */
    .qfy_back {
      display: block;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      font-size: 12px;
      padding: 12px 0 4px;
    }
    .qfy_back:hover { color: var(--qfy-primary); }

    @media (max-width: 430px) {
      body { max-width: 100%; }
      .qfy_tabbar { max-width: 100%; }
    }
  </style>
</head>
<body>
  <header class="qfy_canvas">
    <a class="qfy_search_btn" href="#"><i class="hjicon hjicon-search"></i></a>
    <h1>画世界 · 字体图标底部导航</h1>
    <p>iconfont-3.html —— @font-face + ::before 伪元素渲染</p>
  </header>

  <main class="qfy_content">
    <div class="qfy_card">
      <h3>导航构成</h3>
      <p>4 个固定底部导航项，等宽自适应排列；消息项带数字徽章（5 条未读），发布项带红点提示。点击可切换选中态，当前为「首页」选中。</p>
    </div>
    <div class="qfy_card">
      <h3>字体图标原理</h3>
      <p>通过 <code>@font-face</code> 加载 iconfont.woff2，再用 <code>::before</code> 伪元素写入 Unicode 编码（content），将普通字符渲染为图标。</p>
    </div>
  </main>

  <!-- 固定底部导航 -->
  <nav class="qfy_tabbar">
    <a class="qfy_tab_item qfy_active" href="#">
      <i class="hjicon hjicon-tab-home"></i>
      <span class="qfy_label">首页</span>
    </a>
    <a class="qfy_tab_item" href="#">
      <i class="hjicon hjicon-tab-msg"></i>
      <span class="qfy_label">消息</span>
      <span class="qfy_badge">5</span>
    </a>
    <a class="qfy_tab_item" href="#">
      <i class="hjicon hjicon-tab-create"></i>
      <span class="qfy_label">发布</span>
      <span class="qfy_dot"></span>
    </a>
    <a class="qfy_tab_item" href="#">
      <i class="hjicon hjicon-tab-mine"></i>
      <span class="qfy_label">我的</span>
    </a>
  </nav>

  <a class="qfy_back" href="index.html">← 返回首页 index.html</a>

  <script>
    // 点击切换选中态（演示用）
    var qfy_items = document.querySelectorAll(".qfy_tab_item");
    qfy_items.forEach(function (qfy_item) {
      qfy_item.addEventListener("click", function (qfy_e) {
        qfy_e.preventDefault();
        qfy_items.forEach(function (qfy_i) { qfy_i.classList.remove("qfy_active"); });
        qfy_item.classList.add("qfy_active");
      });
    });
  </script>
</body>
</html>

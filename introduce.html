<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 基础 · 自我介绍网页</title>
    <link rel="stylesheet" href="./fsff.css">
</head>
<body>
    <header>
        <h1 class="title-demo">个人自我介绍</h1>
        <nav><a href="index.html">返回课堂目录</a><a href="form.html">留言表单</a></nav>
    </header>
    <h2 class="title-demo">1. 我的基本信息</h2>
    <p class="text-cont">大家好，我是一名在校学生，热爱前端网页开发，喜欢学习 HTML 和 CSS。</p>
    <p>我的<em>爱好</em>：课余喜欢<strong>写代码</strong>，有<u>充足</u>的学习热情。</p>
    <hr>
    <h2 class="title-demo">2. 兴趣列表</h2>
    <ul class="list-demo"><li>写前端代码</li><li>看电影</li><li>阅读技术书籍</li></ul>
    <ol type="A"><li>学好 HTML</li><li>掌握 CSS 选择器</li><li>完成网页作业</li></ol>
    <h2 class="title-demo">3. 个人信息表格</h2>
    <table id="user-table" border="2" cellspacing="0" cellpadding="3">
        <caption>我的个人信息表</caption>
        <tr><th>姓名</th><th>年龄</th><th>专业</th><th>班级</th></tr>
        <tr><td>高薪和</td><td>20</td><td>计算机</td><td>24002 班</td></tr>
    </table>
    <h2 class="title-demo">4. 语义化标签展示</h2>
    <section>主要内容区域</section><article>个人心得文章区域</article><aside>侧边小提示</aside>
    <footer>©2026 网页前端作业</footer>
</body>
</html>

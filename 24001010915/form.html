<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="kYD6KTd0sPZ4VT3bEsN4Ed">

<head data-page-node-id="EwM5dO6uMAKS4qRQ1JoT8n">
    <meta charset="UTF-8" data-page-node-id="S15daPAuRUBZoJhestHYj0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="aBhFrGgauclRzxCeuYdfdq">
    <title>朱思冰 · 留言表单</title>
    <!-- 外链式 CSS：和主页面共用同一个 html_basic.css 文件 -->
    <link rel="stylesheet" href="html_basic.css" data-page-node-id="fHXJmy6JsHfKHrYJEWnZDr">
</head>

<body class="form-page" data-page-node-id="r90hJ4Maml93BQPmBwVi7p">

    <!-- ============ 导航条 ============ -->
    <nav class="nav-bar" data-page-node-id="eD10Fy0H0DJORZlLkBOIQs">
        <a href="index.html" data-page-node-id="BaP82RLPpIq0mOUWHZfCVo">← 返回目录</a>
        <a href="html.24001010915zsb.html" data-page-node-id="CKyWSNR669B2EQlaQvfpne">返回自我介绍</a>
    </nav>

    <!-- ============ 头部 ============ -->
    <header class="hero hero-small" data-page-node-id="fo7E8ZMtJeSzsz2wDtkNwy">
        <div class="hero-text" data-page-node-id="KtNQwSgcN0CdkBmIFb642B">
            <h1 data-page-node-id="VTxgNoD7pexwH3qsKVOV71">给我留言</h1>
            <p class="text-cont" data-page-node-id="xgC8PbzQv5PqSdHeOaz1gP">欢迎留下你的信息，我会看到。</p>
        </div>
    </header>

    <!-- ============ 表单区域（H5 语义标签：section） ============ -->
    <main class="container" data-page-node-id="nc6dkzfcVIV1aAKAkRNZbi">
        <section id="form-section" data-page-node-id="I9150MO9HJCjSOR74NaAZF">
            <h2 class="title-demo" data-page-node-id="p5xjcw6txaloCUow41AYtW">访客留言表单</h2>

            <!-- 表单 form：method 用 post，action 暂时留空（提交到哪里以后再配） -->
            <form action="#" name="fm" method="post" class="msg-form" data-page-node-id="twz4a7VYnBtCfTe6oRZe2p">

                <!-- 文本框 text，required 表示必填 -->
                <p class="form-row" data-page-node-id="kYV53uaP4dhbhOwJrNSL56">
                    <label for="name" data-page-node-id="iQ3A5EvpPDxZfzOwlBm95e">你的名字：</label>
                    <input type="text" id="name" name="name" placeholder="请输入你的名字" required data-page-node-id="ggSjHnakeCYbNBIaWA3irz">
                </p>

                <!-- 邮箱 email（H5 新增类型） -->
                <p class="form-row" data-page-node-id="F4d1tGB9kkIwjsmROzKqbv">
                    <label for="email" data-page-node-id="nApVzQ9WBOSRV4rwJwi9i4">邮箱：</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" data-page-node-id="uuB5lfTnbqLrCHEIyZUzLU">
                </p>

                <!-- 密码 password -->
                <p class="form-row" data-page-node-id="t4mtcEIR8tcRvvUGumYeST">
                    <label for="pwd" data-page-node-id="1ttnIX2i34mTH4OHHAdKg3">密码（可选）：</label>
                    <input type="password" id="pwd" name="pwd" data-page-node-id="7ChvgyyKCWxXxA5XnwVR6W">
                </p>

                <!-- 单选框 radio：同 name 表示互斥 -->
                <p class="form-row" data-page-node-id="bPxNHg9AMaMtcy4zkIVkpH">
                    <span class="row-label" data-page-node-id="U5aOeAqga2ejvNL1BySEGU">性别：</span>
                    <input type="radio" name="gender" value="f" id="gender-f" data-page-node-id="5FZBsIngOFrdgPDHmwqRf6">
                    <label for="gender-f" data-page-node-id="eLNYx5juLHNtJ5rjXeGEnV">女</label>
                    <input type="radio" name="gender" value="m" id="gender-m" data-page-node-id="pyBNZItcu6Ys8Bf2jh5Mk4">
                    <label for="gender-m" data-page-node-id="COy6gCpBFRVekZDdz7Icvz">男</label>
                </p>

                <!-- 复选框 checkbox -->
                <p class="form-row" data-page-node-id="byO2xzVNAYTyvVFHwLuJUv">
                    <span class="row-label" data-page-node-id="cEqrKmYLr1yfqpe6VlgkF1">爱好：</span>
                    <input type="checkbox" name="hobby" value="reading" id="h-reading" data-page-node-id="4JUG6FFcGKA7Ko8pclt0B9">
                    <label for="h-reading" data-page-node-id="ZkFlSkpBLYDxjf1HuS5EFp">阅读</label>
                    <input type="checkbox" name="hobby" value="music" id="h-music" data-page-node-id="XDRofy8r3LtD18amVNLF6Z">
                    <label for="h-music" data-page-node-id="omMdvKjlwRkx4gKg1E7HPb">音乐</label>
                    <input type="checkbox" name="hobby" value="sport" id="h-sport" data-page-node-id="jAIYK5AXy5piip14l8EYup">
                    <label for="h-sport" data-page-node-id="j32KHokCBpEBTHXCtr2kei">运动</label>
                </p>

                <!-- 下拉选择 select + option -->
                <p class="form-row" data-page-node-id="IBazUeAIGiZYPkRMPZitQA">
                    <label for="city" data-page-node-id="LKZyKKYEYZ8RiDQ7oB3SzJ">你在哪个城市：</label>
                    <select id="city" name="city" data-page-node-id="hjFLZx3lW12QDOSTXKk3c5">
                        <option value="beijing" data-page-node-id="CAAXdm4kCE5X6xvd2iamfN">北京</option>
                        <option value="shanghai" data-page-node-id="oAmD2I9eOAn3fDgnoJXsuK">上海</option>
                        <option value="guangzhou" data-page-node-id="pXUOcHmGflRA7RqGYlfuD3">广州</option>
                        <option value="other" data-page-node-id="MCE7UDv9uGWOu10UErihvG">其他</option>
                    </select>
                </p>

                <!-- 多行文本 textarea -->
                <p class="form-row" data-page-node-id="gE4cs4sDCzwh1E6uipMh0w">
                    <label for="intro" data-page-node-id="RmGacJsYypkhtj2MsRAjsv">想说的话：</label>
                    <textarea id="intro" name="intro" cols="30" rows="6" placeholder="随便写点什么..."></textarea>
                </p>

                <!-- 文件上传 file（H5 新增） -->
                <p class="form-row" data-page-node-id="E0prIJCLEGmHfazChKfwdp">
                    <label for="file" data-page-node-id="PnsDC62YoZxnJW9QzAyWHO">上传一张图片：</label>
                    <input type="file" id="file" name="file" multiple data-page-node-id="qQLVAfi4LodT9aTQRcqsXK">
                </p>

                <!-- 提交 / 重置 / 按钮 -->
                <p class="form-row form-actions" data-page-node-id="0u1gwU070PeLXYKl2isGIM">
                    <input type="submit" value="提交" data-page-node-id="cyDWFlhOzUrxX8namy1f6L">
                    <input type="reset" value="重置" data-page-node-id="L1AJQB2QyB3jgADfN9jO7I">
                    <input type="button" value="取消" data-page-node-id="9u0Bp3BDL9UyrMqoX5iDLR">
                </p>

            </form>

            <!-- 表单外的按钮 button -->
            <button onclick="location.href='index.html'" data-page-node-id="aZzXW55m58hGeuFNjVCDZq">返回目录</button>

        </section>
    </main>

    <!-- ============ 页脚 ============ -->
    <footer class="footer" data-page-node-id="SBulehIGVku6uW7EAQlW7p">
        <p data-page-node-id="iTmRE32AWHBYmQ6p4MBy3s">© 2026 朱思冰 · 网页设计课程作业</p>
    </footer>

</body>

</html>

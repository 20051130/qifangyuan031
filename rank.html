<!--
  作者：齐方圆
  建立时间：2026-11-02
  使用模型：Trae
  功能名称：电视剧排行榜页面
  功能简介：1:1 复刻电视剧热度排行榜，包含每日、每周、每月、全部四个选项卡，
            每个选项卡展示 10 部电视剧的排名（两列布局，前 3 名红色编号，
            4-10 名灰色编号）。使用可复用选项卡组件 QfyTab 实现切换。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电视剧排行榜 - 齐方圆</title>
    <style>
        /* 全局样式重置 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f0f0f0;
            color: #333;
        }

        /* 返回首页链接 */
        .qfy_back {
            display: block;
            padding: 12px 20px;
            color: #1890ff;
            text-decoration: none;
            font-size: 14px;
        }
        .qfy_back:hover { text-decoration: underline; }

        /* 排行榜容器 */
        .qfy_rank_box {
            width: 520px;
            margin: 20px;
            background: #fff;
            border: 1px solid #e0e0e0;
        }

        /* 选项卡按钮容器 */
        .qfy_tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
        }

        /* 单个选项卡按钮 */
        .qfy_tab_item {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 15px;
            color: #666;
            cursor: pointer;
            background: #fafafa;
            border-right: 1px solid #e0e0e0;
            user-select: none;
            transition: color 0.2s, background 0.2s;
        }
        .qfy_tab_item:last-child { border-right: none; }
        .qfy_tab_item:hover { color: #333; }

        /* 选项卡选中状态 */
        .qfy_tab_item.qfy_active {
            color: #333;
            background: #fff;
            font-weight: bold;
        }

        /* 内容面板容器 */
        .qfy_panels {
            padding: 10px 0;
        }

        /* 单个内容面板 */
        .qfy_tab_panel { display: none; }
        .qfy_tab_panel.qfy_active { display: block; }

        /* 排行榜列表：两列布局 */
        .qfy_rank_list {
            display: flex;
            flex-wrap: wrap;
        }

        /* 单个排行项 */
        .qfy_rank_item {
            width: 50%;
            display: flex;
            align-items: center;
            padding: 9px 18px;
            border-bottom: 1px solid #f0f0f0;
        }

        /* 排名编号方块 */
        .qfy_rank_num {
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
            background: #999;
        }
        /* 前三名：红色背景 */
        .qfy_rank_num.qfy_top { background: #c0392b; }

        /* 剧名 */
        .qfy_rank_name {
            font-size: 14px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>网格布局grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .photo_box {
            display: grid;
            /* 网格分成3列，1fr表示每列的宽度为剩余宽度的1份 */
            grid-template-columns: repeat(3, 1fr);
            /* 和上面等价写法：grid-template-columns:1fr 1fr 1fr; */
            gap: 10px 15px; /* 行间距10px，列间距15px */
        }
        .photo {
            min-height: 100px;
            background-color: pink;
            border: 1px solid red;
            border-radius: 5px;
            font-size: 24px;
            color: blue;
            text-align: center;
            line-height: 100px;
        }
        /* 第1个子元素，横向跨2列 */
        .photo:nth-child(1) {
            grid-column: span 2;
        }
        /* 第2个子元素，纵向跨2行 */
        .photo:nth-child(2) {
            grid-row: span 2;
        }
    </style>
</head>
<body>
    <div class="photo_box">
        <div class="photo">1</div>
        <div class="photo">2</div>
        <div class="photo">3</div>
        <div class="photo">4</div>
        <div class="photo">5</div>
        <div class="photo">6</div>
    </div>
</body>
</html>

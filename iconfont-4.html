<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SVG 图标底部导航 | iconfont-4</title>
  <style>
    /* ===== 设计令牌 ===== */
    :root {
      --qfy-primary: #0091fc;
      --qfy-primary-dark: #0077d4;
      --qfy-bg: #0e0f13;
      --qfy-surface: #ffffff;
      --qfy-text: #1a1a2e;
      --qfy-text-muted: #9aa0ac;
      --qfy-badge: #ff4757;
      --qfy-nav-h: 62px;
      --qfy-radius: 16px;
      --qfy-shadow: 0 -6px 30px rgba(0, 0, 0, 0.10);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "SF Pro Text", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at top, #1c2030 0%, var(--qfy-bg) 65%);
      color: var(--qfy-text);
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: calc(var(--qfy-nav-h) + env(safe-area-inset-bottom) + 20px);
    }

    .qfy_canvas {
      position: relative;
      padding: 56px 24px 28px;
      text-align: center;
      color: #fff;
    }
    .qfy_canvas h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .qfy_canvas p { margin: 0; font-size: 13px; opacity: 0.55; }

    /* ===== 右上角搜索图标按钮（玻璃态） ===== */
    .qfy_search_btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.20);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .qfy_search_btn:hover {
      background: rgba(255, 255, 255, 0.24);
      transform: scale(1.08);
    }
    .qfy_search_btn:active { transform: scale(0.95); }
    .qfy_search_btn svg { width: 20px; height: 20px; fill: #fff; }

    .qfy_content { padding: 0 16px 24px; }
    .qfy_card {
      background: var(--qfy-surface);
      border-radius: var(--qfy-radius);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }
    .qfy_card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .qfy_card p {
      margin: 0; font-size: 13px; color: var(--qfy-text-muted); line-height: 1.7;
    }
    .qfy_card code {
      background: rgba(0, 145, 252, 0.10);
      color: var(--qfy-primary-dark);
      padding: 2px 6px; border-radius: 4px; font-size: 12px;
    }

    /* ===== 固定底部导航 ===== */
    .qfy_tabbar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: calc(var(--qfy-nav-h) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--qfy-surface);
      display: flex;
      box-shadow: var(--qfy-shadow);
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      z-index: 100;
    }
    .qfy_tab_item {
      flex: 1;                      /* 4 项等宽自适应 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--qfy-text-muted);
      text-decoration: none;
      position: relative;
      transition: color 0.25s ease;
    }
    .qfy_icon {
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .qfy_icon svg {
      width: 100%; height: 100%;
      display: block;
      fill: currentColor;
    }
    /* 描边版（默认） / 实心版（激活）切换 */
    .qfy_icon .qfy_svg_solid { display: none; }
    .qfy_tab_item.qfy_active .qfy_icon .qfy_svg_outline { display: none; }
    .qfy_tab_item.qfy_active .qfy_icon .qfy_svg_solid { display: block; }

    .qfy_tab_item span.qfy_label { font-size: 11px; font-weight: 500; }
    .qfy_tab_item.qfy_active { color: var(--qfy-primary); }
    .qfy_tab_item.qfy_active .qfy_icon { transform: translateY(-2px) scale(1.06); }
    .qfy_tab_item.qfy_active span.qfy_label { font-weight: 600; }
    .qfy_tab_item.qfy_active::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 16px; height: 3px;
      border-radius: 2px;
      background: var(--qfy-primary);
    }

    /* ===== 数字徽章 ===== */
    .qfy_badge {
      position: absolute;
      top: 4px;
      right: calc(50% - 28px);
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--qfy-badge);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      box-shadow: 0 0 0 2px var(--qfy-surface);
    }

    /* ===== 红点 ===== */
    .qfy_dot {
      position: absolute;
      top: 6px;
      right: calc(50% - 22px);
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--qfy-badge);
      box-shadow: 0 0 0 2px var(--qfy-surface);
      animation: qfy_pulse 1.8s ease-in-out infinite;
    }
    @keyframes qfy_pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.75; }
    }

    .qfy_back {
      display: block; text-align: center;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none; font-size: 12px;
      padding: 12px 0 4px;
    }
    .qfy_back:hover { color: var(--qfy-primary); }

    @media (max-width: 430px) {
      body { max-width: 100%; }
      .qfy_tabbar { max-width: 100%; }
    }
  </style>
</head>

      <p>内联 <code>&lt;svg&gt;</code> 矢量图形，<code>fill="currentColor"</code> 继承文字色；激活态切换为实心版路径，颜色由 CSS 控制。</p>
    </div>
  </main>

  <a class="qfy_back" href="index.html">← 返回首页 index.html</a>

  <script>
    var qfy_items = document.querySelectorAll(".qfy_tab_item");
    qfy_items.forEach(function (qfy_item) {
      qfy_item.addEventListener("click", function (qfy_e) {
        qfy_e.preventDefault();
        qfy_items.forEach(function (qfy_i) { qfy_i.classList.remove("qfy_active"); });
        qfy_item.classList.add("qfy_active");
      });
    });
  </script>

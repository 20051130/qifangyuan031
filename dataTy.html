<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <div class="container">
        <!--   -->
    </div>
<script>
    var a = 10,b=4;
    // 控制台输出
    console.log(++a);
    console.log(a-b>0?a:b);
    console.log(true&&false,true||false,!true);
    var str = "hello world",num = 10,ble = true;
    ud,boj={name:"张三",age:20},arr=[1,2,3,4,5];
    console.log(typeof str,typeof num,typeof ble,typeof ud,typeof obj,typeof arr);
    // 浮点小数不能用二进制精确存储，
    // JS不能用==或者===来判断两个浮点数是否相等
    console.log(0.1+0.2==0.3);
    // 字符类型转换，+将数字转换成字符串，-用能用于数值运算
    console.log('1'+1,1+'1','11'+1-1);
    //NaN表示不是一个数字，isNaN()函数可以判断是否是NaN
    //NaN和任何值都不相等，包括它自己
    console.log("qifangyuan"-1);
    console.log(parseInt(12.9));
    //如何判断一个变量是不是整数
    // 1 到 100：跳过包含 7 或者是 7 的倍数的数
    for (var i = 1; i <= 100; i++) {
        if (i % 7 !== 0 && !String(i).includes("7")) console.log(i);
    }
    
</script>
    
</body>
